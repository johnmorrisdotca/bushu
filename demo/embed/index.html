<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="color-scheme" content="light dark"><title>Bushu · radical picker</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box}bushu-picker{max-height:100%}</style></head><body><script type="module">
import "../dist/element-define.js";
const query=new URLSearchParams(location.search),picker=document.createElement("bushu-picker");picker.setAttribute("size","medium");
for(const[name,choices]of[["size",["small","medium","large"]],["theme",["auto","light","dark"]],["lang",["en","ja"]]])if(choices.includes(query.get(name)))picker.setAttribute(name,query.get(name));
for(const[name,min,max]of[["width",100,2000],["limit",1,500]]){const value=query.get(name);if(value!==null&&/^\d+$/.test(value)&&Number(value)>=min&&Number(value)<=max)picker.setAttribute(name,value);}
const parts=query.get("parts");if(parts!==null&&parts.length<=100&&/^[\p{Script=Han}\p{Script=Katakana}\p{Script=Hiragana}々〇⺀-⻿\s]*$/u.test(parts))picker.setAttribute("parts",parts);
const kanji=query.get("kanji");if(kanji!==null&&/^[\p{Script=Han}々〇]$/u.test(kanji))picker.setAttribute("kanji",kanji);
const label=query.get("label");if(label!==null&&label.length<=200)picker.setAttribute("label",label);if(query.get("lang")==="ja")document.documentElement.lang="ja";
for(const type of["bushu-load","bushu-error","bushu-change","bushu-pick"])picker.addEventListener(type,event=>{if(parent!==window)parent.postMessage({type:event.type,detail:JSON.parse(JSON.stringify(event.detail))},"*");});document.body.append(picker);
</script></body></html>
